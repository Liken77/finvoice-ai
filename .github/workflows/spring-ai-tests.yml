name: Spring AI Tests

on:
  push:
    paths:
      - '05-spring-ai/**'
      - '.github/workflows/spring-ai-tests.yml'
  pull_request:
    paths:
      - '05-spring-ai/**'
      - '.github/workflows/spring-ai-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-spring-ai

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Executar testes
        run: ./gradlew test
